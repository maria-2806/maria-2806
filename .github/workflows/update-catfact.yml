name: Update Cat Fact

on:
  schedule:
    - cron: '0 18 * * *'  
  workflow_dispatch:     

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Run update-catfact.js
        run: node update-catfact.js

      - name: Commit changes
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add README.md
          git diff --cached --quiet || git commit -m "🐱 Updated cat fact"
          git push
